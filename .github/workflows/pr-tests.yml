name: PR tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.rs'
      - 'tests/**/*.rs'
      - 'tests/**/*.js'
      - 'tests/**/*.mjs'
      - 'web/**/*.js'
      - 'web/**/*.mjs'
      - 'web/**/*.html'
      - 'web/**/*.css'
      - 'web/**/*.json'
      - 'web/**/*.webmanifest'
      - 'build-wasm.sh'
      - 'data/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test and apply overrides
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/apply_overrides.py

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build Rust
        run: cargo build --locked

      - name: Test Rust
        # Layout coverage tests repeatedly solve packing problems.
        run: cargo test --release --locked

      - name: Build WASM library
        run: cargo build --locked --release --lib --target wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Test JavaScript
        run: node --test
