name: Deploy to GitHub Pages

# Deploys the site on every push to main (merging a pull request counts), or by hand from the
# Actions tab. Tags no longer deploy: this fork's github-pages environment accepts only the main
# branch, so a tag run would be refused. The test job must pass before anything is built.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false  # a newer push waits; it never cancels a deploy in flight

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test and apply overrides
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/apply_overrides.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test Rust
        # Layout coverage tests repeatedly solve packing problems.
        run: cargo test --release --locked

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Test JavaScript
        run: node --test

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pages: write  # configure-pages reads the Pages site settings
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the build stamp below can find the last upstream commit included.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # --locked keeps wasm-pack's own Cargo.lock, so a crate yanked from crates.io after
        # that lock was made (zip 2.x on 2026-10-16) does not break the install.
        run: cargo install wasm-pack --version 0.15.0 --locked

      # My in-game verified values (data/overrides/) go on top of upstream's files before the build.
      - name: Apply overrides
        run: python3 scripts/apply_overrides.py

      - name: Build WASM
        run: wasm-pack build --target web --out-dir web/pkg

      # Records which build this is and which upstream (ae-bii/aniimax) commit its game data
      # comes from. The page shows it in the footer, and the out-of-date check compares it with
      # upstream's latest data change.
      - name: Stamp the build
        run: |
          git fetch --quiet https://github.com/ae-bii/aniimax main
          UPSTREAM=$(git merge-base HEAD FETCH_HEAD)
          cat > web/version.json <<EOF
          {
            "appVersion": "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')",
            "commit": "$(git rev-parse --short HEAD)",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "upstream": {
              "commit": "$(git rev-parse --short "$UPSTREAM")",
              "date": "$(git log -1 --format=%cI "$UPSTREAM")"
            }
          }
          EOF
          cat web/version.json

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # Pages can take a minute to serve the new files. Warns (does not fail) if the live
      # version.json still shows another commit after 3 minutes.
      - name: Check the live build stamp
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            LIVE=$(curl -fsSL --max-time 15 "${PAGE_URL%/}/version.json?t=$(date +%s)" | sed -n 's/.*"commit": *"\([0-9a-f]*\)".*/\1/p' | head -n 1 || true)
            if [ -n "$LIVE" ]; then
              case "$SHA" in
                "$LIVE"*)
                  echo "Live version.json shows commit $LIVE."
                  exit 0
                  ;;
              esac
            fi
            echo "Live commit is '${LIVE:-unknown}', waiting for ${SHA:0:7} ($i/12)."
            sleep 15
          done
          echo "::warning::The live version.json stamp did not match ${SHA:0:7} yet (last seen: ${LIVE:-unknown}). Pages may still be updating."
